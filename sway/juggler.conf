# juggler — workstream bindings for sway.
# Installed to ~/.config/sway/juggler.conf by `make install`; pulled into the
# main config with:   include ~/.config/sway/juggler.conf
#
# Requires workspaces named "N:name" and switched with `workspace number`,
# so the slot's label can change to "N:WS" while $mod+N keeps working.
#
#   $mod+t          pick a workstream (fuzzel); Enter on "+ new workstream…" creates one
#   $mod+w          action menu: a floating window listing the actions that apply;
#                   press ONE key — t term · j jira · p pr · n notes · r review ·
#                   o opencode · d dictate · w pick · l lot · x park · s slot · c close ·
#                   g go (show the parked workstream under focus, in the lot) · Esc cancel
#   $mod+equal      visit the lot (parked workstreams, one tab each) and come back
#   $mod+plus       same (Shift+equal)
#   $mod+Shift+t    toggle the focused workspace as the workstream slot (label "WS")
#
# `jug` is found via PATH as sway sees it; set $jug explicitly if needed.
set $jug jug

bindsym $mod+t exec $jug pick
bindsym $mod+w exec $jug menu
bindsym $mod+equal exec $jug lot
bindsym $mod+plus exec $jug lot
bindsym $mod+Shift+t exec $jug toggle
# Optional, if you use dictator (https://github.com/varlogtim/dictator):
# notes go into the displayed workstream's notes/ dir.
# bindsym $mod+Ctrl+n exec $jug dictate

# The menu window: floating, centred, sized by its content (alacritty
# window.dimensions), never inherits a tiling spot in a workstream.
for_window [app_id="^jug-menu$"] floating enable, border pixel 3, move position center
