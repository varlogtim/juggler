<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>juggler</title>
<link rel="stylesheet" href="/ui/style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='5' height='16' fill='%230087ff'/%3E%3Crect x='6' width='10' height='7' fill='%23bfbfbf'/%3E%3Crect x='6' y='9' width='10' height='7' fill='%237f7f7f'/%3E%3C/svg%3E">
</head>
<body>
<header id="top">
  <div class="brand"><span class="logo"></span><span>juggler</span><span id="live" class="dot" title="live updates"></span></div>
  <div id="status" class="status"></div>
  <div class="actions">
    <button id="btn-view" title="grouped / flat list">grouped</button>
    <button id="btn-groups" title="manage groups (Alt+G)">groups…</button>
    <button id="btn-toggle" title="toggle the focused workspace as the slot">slot</button>
    <button id="btn-park" title="hide the displayed workstream">park</button>
    <button id="btn-lot" title="visit the lot / come back">lot</button>
    <button id="btn-new" class="primary">+ new</button>
  </div>
</header>

<main>
  <section id="list-pane">
    <div class="toolbar">
      <input id="filter" type="search" placeholder="filter  (id, description, category, group, branch, ref…)   /" autocomplete="off">
      <label class="chk"><input id="only-live" type="checkbox"> live only</label>
      <span id="count" class="muted"></span>
    </div>
    <table id="list">
      <thead><tr>
        <th></th><th>id</th><th>category</th><th>description</th><th>refs</th><th>todo</th><th>branch</th><th>session</th><th></th>
      </tr></thead>
      <tbody></tbody>
    </table>
    <div id="empty" class="empty hidden">No workstreams yet. <a href="#" id="empty-new">Create one</a>.</div>
  </section>

  <section id="detail-pane" class="hidden"></section>
</main>

<div id="modal" class="modal hidden" role="dialog" aria-modal="true">
  <div class="modal-box">
    <div class="modal-head"><h2 id="modal-title"></h2><button class="close" id="modal-close" title="close (Esc)">×</button></div>
    <div id="modal-body"></div>
  </div>
</div>

<div id="toasts"></div>
<script src="/ui/app.js"></script>
</body>
</html>
